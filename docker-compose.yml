services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_EMBEDDED=false
      # Realtime ingestion (Finnhub WS + Massive) runs as a lifespan-spawned
      # subprocess inside this container. Finnhub/Massive work over the public
      # internet; IBKR points at the host's TWS/Gateway (127.0.0.1 in a
      # container is the container itself, so use host.docker.internal). If no
      # TWS is running on the host, IBKR just retries harmlessly.
      - REALTIME_ENABLED=true
      - IBKR_HOST=${IBKR_HOST:-host.docker.internal}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Pull the whole backend stack up whenever the API starts (so that
      # `docker compose up -d api|frontend|nginx` also brings the schedulers and
      # workers — otherwise signals never refresh and background data never
      # updates). These are start-order only (no health gate).
      celery_beat:
        condition: service_started
      celery_worker:
        condition: service_started
      ml_worker:
        condition: service_started
      # NOTE: `scraper` is intentionally omitted — data.scrapers.runner does not
      # exist yet (the Twitter/Reddit scrapers are stubs). Re-add it here and
      # uncomment the service below once the runner is implemented.
    restart: unless-stopped
    ports:
      - "8000:8000"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: penguinai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-penguinai_dev}
      POSTGRES_DB: penguinai
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penguinai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Gemma 4 LLM (Agent 2 reasoner) — standalone Ollama service ──────────────
  # Serves gemma4:e2b on the compose network at http://gemma:11434.
  # Auto-pulls the model on first boot into the ollama_models volume.
  #
  # ⚠️ macOS: Docker Desktop has NO GPU passthrough, so this container is
  #   CPU-only (slow). For Mac dev, prefer NATIVE Ollama (`make gemma-serve`,
  #   Metal-accelerated) and point the worker at the host instead — set in .env:
  #     OLLAMA_BASE_URL=http://host.docker.internal:11434
  #   then you can skip this service.  On Linux + nvidia-container-toolkit,
  #   uncomment the `deploy:` block for GPU acceleration.
  gemma:
    # Opt-in only: `docker compose --profile container-llm up`. On macOS this
    # container is CPU-only AND its bundled Ollama is too old for Gemma 4 (412),
    # so the default path uses the host's native Ollama via OLLAMA_BASE_URL=
    # http://host.docker.internal:11434 (set in .env). Enable this profile on a
    # Linux/GPU host and set OLLAMA_BASE_URL back to http://gemma:11434.
    profiles: ["container-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    # To reach it from the host (e.g. `make gemma-check`), publish the port:
    # ports:
    #   - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=4
      - GEMMA_PULL_MODEL=${GEMMA_PULL_MODEL:-gemma4:e2b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        pid=$$!
        until ollama ps >/dev/null 2>&1; do sleep 1; done
        echo "Pulling $${GEMMA_PULL_MODEL} (first boot only)..."
        ollama pull "$${GEMMA_PULL_MODEL}" || echo "pull failed; using cached models"
        wait $$pid
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s
    restart: unless-stopped
    # GPU (Linux + nvidia-container-toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  celery_worker:
    build:
      context: .
      dockerfile: ml/Dockerfile
      args:
        # CPU torch by default (builds on Mac/ARM). GPU host: set TORCH_SPEC +
        # TORCH_INDEX_URL in .env to install the cu124 wheels instead.
        TORCH_SPEC: ${TORCH_SPEC:-torch==2.5.1 torchvision==0.20.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
    command: celery -A ml.tasks.celery_app worker --loglevel=info --queues=default -c 4
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ml_worker:
    build:
      context: .
      dockerfile: ml/Dockerfile
      args:
        # CPU torch by default (builds on Mac/ARM). GPU host: set TORCH_SPEC +
        # TORCH_INDEX_URL in .env to install the cu124 wheels instead.
        TORCH_SPEC: ${TORCH_SPEC:-torch==2.5.1 torchvision==0.20.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
    command: celery -A ml.tasks.celery_app worker --loglevel=info --queues=ml_inference -c 1
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
      # Reach the standalone gemma service over the compose network.
      # On Mac with native Ollama instead, override in .env:
      #   OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_BACKEND=ollama
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://gemma:11434}
    volumes:
      # Trained model pickles live on the host (written by the daily pipeline);
      # mount them so the worker can load xgboost_prod.pkl / rf_prod.pkl instead
      # of falling back to NEUTRAL "models not available" signals. MODEL_DIR
      # resolves to /app/models/penguinai inside the container.
      - ./models:/app/models
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # gemma is profile-gated (container-llm) and off by default; the worker
      # talks to the host's Ollama via OLLAMA_BASE_URL. Re-add a gemma
      # dependency here only when running with --profile container-llm.
    restart: unless-stopped
    # GPU: uncomment below on hosts with nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  celery_beat:
    build:
      context: .
      dockerfile: ml/Dockerfile
      args:
        # CPU torch by default (builds on Mac/ARM). GPU host: set TORCH_SPEC +
        # TORCH_INDEX_URL in .env to install the cu124 wheels instead.
        TORCH_SPEC: ${TORCH_SPEC:-torch==2.5.1 torchvision==0.20.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
    command: celery -A ml.tasks.celery_app beat --loglevel=info
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # DISABLED until the social scrapers are implemented: `data.scrapers.runner`
  # does not exist yet (data/scrapers/ only has stub twitter/reddit modules), so
  # this container crash-loops. Uncomment once the runner is built, and re-add
  # `scraper` to the api `depends_on` block above.
  # scraper:
  #   build:
  #     context: .
  #     dockerfile: data/Dockerfile
  #   command: python -m data.scrapers.runner
  #   env_file:
  #     - path: .env
  #       required: false
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     timescaledb:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
  ollama_models:

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_EMBEDDED=false
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8000:8000"

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: penguinai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-penguinai_dev}
      POSTGRES_DB: penguinai
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penguinai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Gemma 4 LLM (Agent 2 reasoner) — standalone Ollama service ──────────────
  # Serves gemma4:e2b on the compose network at http://gemma:11434.
  # Auto-pulls the model on first boot into the ollama_models volume.
  #
  # ⚠️ macOS: Docker Desktop has NO GPU passthrough, so this container is
  #   CPU-only (slow). For Mac dev, prefer NATIVE Ollama (`make gemma-serve`,
  #   Metal-accelerated) and point the worker at the host instead — set in .env:
  #     OLLAMA_BASE_URL=http://host.docker.internal:11434
  #   then you can skip this service.  On Linux + nvidia-container-toolkit,
  #   uncomment the `deploy:` block for GPU acceleration.
  gemma:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    # To reach it from the host (e.g. `make gemma-check`), publish the port:
    # ports:
    #   - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=4
      - GEMMA_PULL_MODEL=${GEMMA_PULL_MODEL:-gemma4:e2b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        pid=$$!
        until ollama ps >/dev/null 2>&1; do sleep 1; done
        echo "Pulling $${GEMMA_PULL_MODEL} (first boot only)..."
        ollama pull "$${GEMMA_PULL_MODEL}" || echo "pull failed; using cached models"
        wait $$pid
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s
    restart: unless-stopped
    # GPU (Linux + nvidia-container-toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  celery_worker:
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: celery -A ml.tasks.celery_app worker --loglevel=info --queues=default -c 4
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ml_worker:
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: celery -A ml.tasks.celery_app worker --loglevel=info --queues=ml_inference -c 1
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
      # Reach the standalone gemma service over the compose network.
      # On Mac with native Ollama instead, override in .env:
      #   OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_BACKEND=ollama
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://gemma:11434}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      gemma:
        condition: service_started
    restart: unless-stopped
    # GPU: uncomment below on hosts with nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  celery_beat:
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: celery -A ml.tasks.celery_app beat --loglevel=info
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: data/Dockerfile
    command: python -m data.scrapers.runner
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://penguinai:${DB_PASSWORD:-penguinai_dev}@timescaledb:5432/penguinai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
  ollama_models:

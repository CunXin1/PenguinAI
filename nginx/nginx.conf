events { worker_connections 1024; }

http {
    # Docker's embedded DNS. Combined with a variable in proxy_pass below, this
    # makes nginx re-resolve the api/frontend hostnames at request time instead
    # of caching the IP at config-load. Recreating those containers (which gives
    # them a new IP) used to strand nginx on a stale IP → 502 on every
    # `docker compose up`. valid=10s caps how long a resolved IP is cached.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /api/ {
            set                $api http://api:8000;
            proxy_pass         $api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        location /health {
            set        $api http://api:8000;
            proxy_pass $api;
        }

        location /docs {
            set        $api http://api:8000;
            proxy_pass $api;
        }

        location /redoc {
            set        $api http://api:8000;
            proxy_pass $api;
        }

        location / {
            set                $frontend http://frontend:3000;
            proxy_pass         $frontend;
            proxy_set_header   Host $host;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "ml", "data", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI pattern)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "data"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # many ML libs lack stubs
exclude = ["migrations/", "scripts/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "ml/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

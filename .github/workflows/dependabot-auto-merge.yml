name: Dependabot auto-merge

# Auto-merges ONLY low-risk Dependabot PRs (patch bumps + GitHub Actions).
# Everything else — minors and all majors — waits for a human.
# Safety relies on branch protection: auto-merge will not complete until the
# required CI checks (Backend CI / Frontend CI / ML Lint) pass.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Safe bucket: patch updates, or any GitHub Actions bump.
      # To also auto-merge minors, add:
      #   || steps.meta.outputs.update-type == 'version-update:semver-minor'
      - name: Enable auto-merge for safe updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
